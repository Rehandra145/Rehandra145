<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" xml:space="preserve" role="img" aria-label="Animated terminal showing neofetch, current project, skills and a build sequence for rehandra@edge">
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 14px; white-space: pre; }
    .ty { clip-path: inset(0 100% 0 0); }
    .fi { opacity: 0; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { fill: #e6edf3; } 50%, 100% { fill: transparent; } }
    .cur { animation: blink 1s steps(1) infinite; }
    .g  { fill: #50fa7b; font-weight: bold; }
    .b  { fill: #5aa2ff; font-weight: bold; }
    .w  { fill: #e6edf3; }
    .d  { fill: #6b7f89; }
    .c  { fill: #00e5ff; font-weight: bold; }
    .y  { fill: #f1fa8c; font-weight: bold; }
    .m  { fill: #ff79c6; font-weight: bold; }
    .r  { fill: #ff5555; font-weight: bold; }
    .o  { fill: #ffb86c; font-weight: bold; }
  </style>

  <!-- WINDOW -->
  <rect x="1" y="1" width="858" height="638" rx="12" fill="#0b141a" stroke="#2c5364" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h834 a12 12 0 0 1 12 12 v22 h-858 z" fill="#1b2b34"/>
  <circle cx="26" cy="18" r="6.5" fill="#ff5f56"/>
  <circle cx="48" cy="18" r="6.5" fill="#ffbd2e"/>
  <circle cx="70" cy="18" r="6.5" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" style="font-size:13px" class="d">rehandra@edge: ~</text>

  <!-- 1. neofetch -->
  <text x="24" y="70" class="ty" style="animation: type 1s steps(25,end) 0.4s forwards"><tspan class="g">rehandra@edge</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ neofetch</tspan></text>

  <g class="fi" style="animation: show .3s ease 1.6s forwards">
    <text x="44" y="104" fill="#00e5ff">  ┌─┬─┬─┬─┬─┐</text>
    <text x="44" y="126" fill="#00e5ff">──┤ ░░░░░░░ ├──</text>
    <text x="44" y="148"><tspan fill="#00e5ff">──┤  </tspan><tspan class="y">ESP32</tspan><tspan fill="#00e5ff">  ├──</tspan></text>
    <text x="44" y="170" fill="#00e5ff">──┤ ░░░░░░░ ├──</text>
    <text x="44" y="192" fill="#00e5ff">──┤ ░░░░░░░ ├──</text>
    <text x="44" y="214" fill="#00e5ff">  └─┴─┴─┴─┴─┘</text>
  </g>

  <text x="300" y="104" class="fi" style="animation: show .3s ease 1.7s forwards"><tspan class="g">rehandra</tspan><tspan class="w">@</tspan><tspan class="g">edge</tspan></text>
  <text x="300" y="126" class="fi d" style="animation: show .3s ease 1.8s forwards">─────────────</text>
  <text x="300" y="148" class="fi" style="animation: show .3s ease 1.9s forwards"><tspan class="c">Role</tspan><tspan class="d"> ..... </tspan><tspan class="w">Computer Science Student</tspan></text>
  <text x="300" y="170" class="fi" style="animation: show .3s ease 2.0s forwards"><tspan class="c">Uni</tspan><tspan class="d"> ...... </tspan><tspan class="w">Universitas Riau</tspan></text>
  <text x="300" y="192" class="fi" style="animation: show .3s ease 2.1s forwards"><tspan class="c">Focus</tspan><tspan class="d"> .... </tspan><tspan class="m">Embedded</tspan><tspan class="d"> · </tspan><tspan class="o">Robotics</tspan><tspan class="d"> · </tspan><tspan class="g">Edge AI</tspan></text>
  <text x="300" y="214" class="fi" style="animation: show .3s ease 2.2s forwards"><tspan class="c">Stack</tspan><tspan class="d"> .... </tspan><tspan class="y">Python</tspan><tspan class="d"> · </tspan><tspan class="b">C/C++</tspan><tspan class="d"> · </tspan><tspan class="r">ESP32</tspan><tspan class="d"> · </tspan><tspan class="m">RPi</tspan></text>
  <text x="300" y="236" class="fi" style="animation: show .3s ease 2.3s forwards"><tspan class="c">Uptime</tspan><tspan class="d"> ... </tspan><tspan class="w">since "Hello, World!"</tspan></text>
  <text x="300" y="258" class="fi" style="animation: show .3s ease 2.4s forwards"><tspan class="c">Fuel</tspan><tspan class="d"> ..... </tspan><tspan class="w">coffee + curiosity + compile errors ☕</tspan></text>

  <g class="fi" style="animation: show .4s ease 2.6s forwards">
    <rect x="300" y="274" width="26" height="14" fill="#ff5555"/>
    <rect x="326" y="274" width="26" height="14" fill="#ffb86c"/>
    <rect x="352" y="274" width="26" height="14" fill="#f1fa8c"/>
    <rect x="378" y="274" width="26" height="14" fill="#50fa7b"/>
    <rect x="404" y="274" width="26" height="14" fill="#00e5ff"/>
    <rect x="430" y="274" width="26" height="14" fill="#5aa2ff"/>
    <rect x="456" y="274" width="26" height="14" fill="#bd93f9"/>
    <rect x="482" y="274" width="26" height="14" fill="#ff79c6"/>
  </g>

  <!-- 2. cat now.txt -->
  <text x="24" y="322" class="ty" style="animation: type 1s steps(28,end) 3s forwards"><tspan class="g">rehandra@edge</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ cat now.txt</tspan></text>
  <text x="24" y="344" class="fi" style="animation: show .3s ease 4.1s forwards"><tspan class="g">&gt;</tspan><tspan class="w"> squeezing AI models into </tspan><tspan class="o">resource-constrained devices</tspan></text>
  <text x="24" y="366" class="fi" style="animation: show .3s ease 4.5s forwards"><tspan class="g">&gt;</tspan><tspan class="y"> building:</tspan><tspan class="c"> Robot Voice Command NLU Pipeline</tspan><tspan class="d"> (comand-inst)</tspan></text>

  <!-- 3. ls skills -->
  <text x="24" y="400" class="ty" style="animation: type 1s steps(29,end) 5.2s forwards"><tspan class="g">rehandra@edge</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ ls ~/skills/</tspan></text>
  <text x="24" y="422" class="fi" style="animation: show .3s ease 6.3s forwards"><tspan class="b">embedded/</tspan><tspan>  </tspan><tspan class="m">robotics/</tspan><tspan>  </tspan><tspan class="c">edge-ai/</tspan><tspan>  </tspan><tspan class="y">ml-nlp/</tspan><tspan>  </tspan><tspan class="g">web/</tspan></text>

  <!-- 4. sudo make robot -->
  <text x="24" y="456" class="ty" style="animation: type 1.1s steps(32,end) 7s forwards"><tspan class="g">rehandra@edge</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ </tspan><tspan class="r">sudo</tspan><tspan class="w"> make robot</tspan></text>
  <text x="24" y="478" class="fi" style="animation: show .3s ease 8.2s forwards"><tspan class="o">[sudo] password for rehandra: </tspan><tspan class="d">********</tspan></text>
  <text x="24" y="500" class="fi" style="animation: show .3s ease 8.7s forwards"><tspan class="c">[ 25%]</tspan><tspan class="w"> Compiling ideas...</tspan></text>
  <text x="24" y="522" class="fi" style="animation: show .3s ease 9.2s forwards"><tspan class="c">[ 50%]</tspan><tspan class="w"> Flashing firmware...</tspan></text>
  <text x="24" y="544" class="fi" style="animation: show .3s ease 9.7s forwards"><tspan class="c">[ 75%]</tspan><tspan class="w"> Quantizing model to </tspan><tspan class="m">INT8</tspan><tspan class="w">...</tspan></text>
  <text x="24" y="566" class="fi" style="animation: show .3s ease 10.2s forwards"><tspan class="g">[100%] Done.</tspan><tspan class="y"> It works.</tspan><tspan class="d"> (Don't touch it.)</tspan></text>

  <!-- 5. final prompt -->
  <text x="24" y="600" class="fi" style="animation: show .3s ease 10.8s forwards"><tspan class="g">rehandra@edge</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ </tspan><tspan class="cur">█</tspan></text>
</svg>
